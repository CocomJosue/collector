<div class="d-flex">
  <h3>Progreso total</h3>
  <mat-progress-spinner
    [mode]="mode"
    [value]="progressService.progress()">
  </mat-progress-spinner>
  <div class="percentage">
    <h3>{{ progressService.progress() }}%</h3>
  </div>
  <h4>{{ progressService.totalCount() }} / {{ goal }}</h4>
</div>
